[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxgpt-env"
version = "0.1.0"
description = "A Gymnasium environment for active localization of a hidden rectangle"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "gymnasium>=0.29,<2",
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4"]

[tool.setuptools]
py-modules = ["box_gym"]
