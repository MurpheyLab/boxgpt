<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BoxGPT Demo</title>

    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: white;
        }

        /* center the demo on the page */
        .page {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Responsive square demo iframe */
        .demo-embed {
            width: 100%;
            max-width: 600px;
            margin: 1.5rem auto;
        }

        .demo-embed iframe {
            width: 100%;
            height: 800px;
            /* start with a safe height */
            border: 0;
            display: block;
        }
    </style>
</head>


<body>
    <div class="page">
        <div class="demo-embed">
            <iframe src="boxgpt_automation.html" loading="lazy"></iframe>
        </div>
    </div>
</body>

</html>
