<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Plan a trajectory for the BoxGPT sensor using prior measurements.">
    <title>BoxGPT: Embodied Data Intelligence</title>

    <style>
        :root {
            --ink: #111;
            --muted: #4f4f4f;
            --path: #1468d4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: #fff;
            color: var(--ink);
        }

        .demo-shell {
            width: min(100%, 900px);
            margin: 0 auto;
        }

        h2 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .stage {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 3px solid #000;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            touch-action: none;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        button {
            appearance: none;
            border: 2px solid #000;
            background: #fff;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font: inherit;
            font-size: 18px;
            font-weight: 600;
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
        }

        button:disabled {
            cursor: default;
            opacity: 0.42;
        }

        #runButton:not(:disabled) {
            color: var(--path);
            border-color: var(--path);
        }

        .hint {
            min-height: 3.1em;
            margin-top: 10px;
            color: #333;
            font-size: 14px;
            line-height: 1.45;
        }

        .budget {
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .budget-track {
            height: 6px;
            margin-top: 5px;
            overflow: hidden;
            border-radius: 999px;
            background: #e2e2e2;
        }

        .budget-fill {
            width: 0;
            height: 100%;
            background: var(--path);
            transition: width 80ms linear;
        }
    </style>
</head>
<body>
    <div class="demo-shell">
        <h2>Plan a Data Collection Trajectory</h2>

        <div class="stage" id="stage" aria-label="Draw a continuous sensor trajectory from the outlined square">
            <canvas id="canvas" width="640" height="640"></canvas>
        </div>

        <p class="budget" id="budgetText">Motion budget used: 0%</p>
        <div class="budget-track" aria-hidden="true">
            <div class="budget-fill" id="budgetFill"></div>
        </div>

        <div class="button-row">
            <button id="resetButton" type="button">Reset</button>
            <button id="runButton" type="button" disabled>Run Trajectory</button>
            <button id="truthButton" type="button">Show Ground Truth</button>
        </div>

        <div class="hint" id="hint" aria-live="polite">
            <strong>Start at the sensor and drag one continuous path.</strong>
            Only the initial measurements are visible while you plan. New measurements appear as the sensor runs along your trajectory.
        </div>
    </div>

    <script>
        // Fixed logical coordinates keep the experiment identical at every display size.
        const ENV_SIZE = 640;
        const INITIAL_SEED = 42;
        const PATH_BUDGET = 1800;
        const MIN_PATH_LENGTH = 80;
        const START = { x: 76, y: 548 };
        const START_RADIUS = 34;
        const SENSOR_SIZE = 64;
        const SENSOR_SAMPLE_INTERVAL = 100;
        const SAMPLES_PER_READING = 1;
        const SENSOR_UNCERTAINTY = 0.5;
        const CANDIDATE_COUNT = 10;
        const CANDIDATE_REFRESH_INTERVAL = 100;
        const SENSOR_SPEED = 145;

        const stage = document.getElementById("stage");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const resetButton = document.getElementById("resetButton");
        const runButton = document.getElementById("runButton");
        const truthButton = document.getElementById("truthButton");
        const hint = document.getElementById("hint");
        const budgetText = document.getElementById("budgetText");
        const budgetFill = document.getElementById("budgetFill");

        let groundTruth = null;
        let priorMeasurements = [];
        let candidateBoxes = [];
        let random = Math.random;

        let path = [];
        let pathLength = 0;
        let futureMeasurements = [];
        let drawing = false;
        let mode = "planning";
        let showTruth = false;
        let activePointerId = null;
        let sensorPosition = { ...START };
        let runDistance = 0;
        let previousAnimationTime = null;
        let lastSensorSample = 0;
        let lastCandidateRefresh = 0;

        function mulberry32(seed) {
            return function () {
                let t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function contains(rect, point) {
            return point.x >= rect.left && point.x <= rect.right &&
                point.y >= rect.top && point.y <= rect.bottom;
        }

        function isConsistent(rect, measurements) {
            return measurements.every(point => contains(rect, point) === point.positive);
        }

        function sampleCandidateBoxes(measurements) {
            const positives = measurements.filter(point => point.positive);
            const minX = Math.min(...positives.map(point => point.x));
            const maxX = Math.max(...positives.map(point => point.x));
            const minY = Math.min(...positives.map(point => point.y));
            const maxY = Math.max(...positives.map(point => point.y));
            const candidates = [];
            let attempts = 0;

            while (candidates.length < CANDIDATE_COUNT && attempts < 50000) {
                const candidate = {
                    left: random() * minX,
                    top: random() * minY,
                    right: maxX + random() * (ENV_SIZE - maxX),
                    bottom: maxY + random() * (ENV_SIZE - maxY)
                };
                if (isConsistent(candidate, measurements)) {
                    candidates.push(candidate);
                }
                attempts++;
            }
            return candidates;
        }

        function makeProblem() {
            const margin = 72;
            const width = 150 + random() * 140;
            const height = 150 + random() * 140;
            const left = margin + random() * (ENV_SIZE - 2 * margin - width);
            const top = margin + random() * (ENV_SIZE - 2 * margin - height);
            groundTruth = { left, top, right: left + width, bottom: top + height };

            const positiveMargin = 18;
            priorMeasurements = [];
            for (let index = 0; index < 3; index++) {
                priorMeasurements.push({
                    x: groundTruth.left + positiveMargin + random() * (width - 2 * positiveMargin),
                    y: groundTruth.top + positiveMargin + random() * (height - 2 * positiveMargin),
                    positive: true
                });
            }

            while (priorMeasurements.length < 10) {
                const point = {
                    x: 42 + random() * (ENV_SIZE - 84),
                    y: 42 + random() * (ENV_SIZE - 84)
                };
                if (!contains(groundTruth, point) && distance(point, START) > 48) {
                    priorMeasurements.push({ ...point, positive: false });
                }
            }
            candidateBoxes = sampleCandidateBoxes(priorMeasurements);
        }

        function resizeCanvas() {
            const cssSize = Math.max(200, Math.floor(stage.clientWidth));
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.floor(cssSize * dpr);
            canvas.height = Math.floor(cssSize * dpr);
            ctx.setTransform(
                dpr * cssSize / ENV_SIZE,
                0,
                0,
                dpr * cssSize / ENV_SIZE,
                0,
                0
            );
            draw();
        }

        function pointFromEvent(event) {
            const bounds = stage.getBoundingClientRect();
            const minCenter = SENSOR_SIZE / 2;
            const maxCenter = ENV_SIZE - SENSOR_SIZE / 2 - 5;
            return {
                x: Math.max(minCenter, Math.min(maxCenter, (event.clientX - bounds.left) * ENV_SIZE / bounds.width)),
                y: Math.max(minCenter, Math.min(maxCenter, (event.clientY - bounds.top) * ENV_SIZE / bounds.height))
            };
        }

        function distance(a, b) {
            return Math.hypot(b.x - a.x, b.y - a.y);
        }

        function appendPathPoint(point) {
            const previous = path[path.length - 1];
            const segmentLength = distance(previous, point);
            if (segmentLength < 1) return;

            const remaining = PATH_BUDGET - pathLength;
            if (segmentLength > remaining) {
                const ratio = remaining / segmentLength;
                path.push({
                    x: previous.x + (point.x - previous.x) * ratio,
                    y: previous.y + (point.y - previous.y) * ratio
                });
                pathLength = PATH_BUDGET;
                finishDrawing();
            } else {
                path.push(point);
                pathLength += segmentLength;
            }

            updateBudget();
            draw();
        }

        function updateBudget() {
            const percent = Math.round(100 * pathLength / PATH_BUDGET);
            budgetText.textContent = `Motion budget used: ${percent}%`;
            budgetFill.style.width = `${percent}%`;
        }

        function beginDrawing(event) {
            if (mode !== "planning" || path.length > 1 || event.button > 0) return;
            const point = pointFromEvent(event);
            if (distance(point, START) > START_RADIUS) {
                hint.innerHTML = "<strong>Begin at the outlined square.</strong> Then drag one continuous path through the space.";
                return;
            }

            drawing = true;
            activePointerId = event.pointerId;
            path = [{ ...START }];
            stage.setPointerCapture(event.pointerId);
            event.preventDefault();
        }

        function continueDrawing(event) {
            if (!drawing || event.pointerId !== activePointerId) return;
            appendPathPoint(pointFromEvent(event));
            event.preventDefault();
        }

        function finishDrawing() {
            if (!drawing) return;
            drawing = false;
            if (activePointerId !== null && stage.hasPointerCapture(activePointerId)) {
                stage.releasePointerCapture(activePointerId);
            }
            activePointerId = null;

            if (pathLength >= MIN_PATH_LENGTH) {
                runButton.disabled = false;
                hint.innerHTML = "Path ready. Select <strong>Run Trajectory</strong> to send the sensor along it, or <strong>Reset</strong> for a new problem.";
            } else {
                path = [];
                pathLength = 0;
                updateBudget();
                hint.innerHTML = "<strong>That path was too short.</strong> Start at the outlined square and try again.";
                draw();
            }
        }

        function pointAtPathDistance(targetDistance) {
            let traversed = 0;
            for (let index = 1; index < path.length; index++) {
                const start = path[index - 1];
                const end = path[index];
                const segmentLength = distance(start, end);
                if (traversed + segmentLength >= targetDistance) {
                    const ratio = segmentLength === 0 ? 0 : (targetDistance - traversed) / segmentLength;
                    return {
                        x: start.x + (end.x - start.x) * ratio,
                        y: start.y + (end.y - start.y) * ratio
                    };
                }
                traversed += segmentLength;
            }
            return { ...path[path.length - 1] };
        }

        function allMeasurements() {
            return priorMeasurements.concat(futureMeasurements);
        }

        function refreshCandidateBoxes() {
            const refreshed = sampleCandidateBoxes(allMeasurements());
            if (refreshed.length > 0) candidateBoxes = refreshed;
        }

        function sampleSensor() {
            const halfSize = SENSOR_SIZE / 2;
            for (let index = 0; index < SAMPLES_PER_READING; index++) {
                if (random() >= 1 - SENSOR_UNCERTAINTY) continue;
                const point = {
                    x: sensorPosition.x - halfSize + random() * SENSOR_SIZE,
                    y: sensorPosition.y - halfSize + random() * SENSOR_SIZE
                };
                futureMeasurements.push({
                    ...point,
                    positive: contains(groundTruth, point)
                });
            }
            refreshCandidateBoxes();
        }

        function startTrajectory() {
            if (runButton.disabled || mode !== "planning") return;
            mode = "running";
            runDistance = 0;
            sensorPosition = { ...START };
            previousAnimationTime = null;
            lastSensorSample = 0;
            runButton.disabled = true;
            runButton.textContent = "Running…";
            hint.innerHTML = "<strong>Sensor running.</strong> Measurements appear only as the sensor reaches them.";
        }

        function resetProblem(seed = null) {
            if (activePointerId !== null && stage.hasPointerCapture(activePointerId)) {
                stage.releasePointerCapture(activePointerId);
            }
            const nextSeed = seed === null
                ? (Date.now() + Math.floor(Math.random() * 1000000)) >>> 0
                : seed;
            random = mulberry32(nextSeed);
            path = [];
            pathLength = 0;
            futureMeasurements = [];
            drawing = false;
            mode = "planning";
            showTruth = false;
            activePointerId = null;
            sensorPosition = { ...START };
            runDistance = 0;
            previousAnimationTime = null;
            lastSensorSample = 0;
            lastCandidateRefresh = 0;
            runButton.disabled = true;
            runButton.textContent = "Run Trajectory";
            truthButton.textContent = "Show Ground Truth";
            makeProblem();
            hint.innerHTML = "<strong>Start at the outlined square and drag one continuous path.</strong> " +
                "Only the initial measurements are visible while you plan. New measurements appear as the sensor runs along your trajectory.";
            updateBudget();
            draw();
        }

        function drawCandidateBoxes() {
            if (candidateBoxes.length === 0) return;
            ctx.save();
            ctx.strokeStyle = "red";
            ctx.lineWidth = 2;
            for (const box of candidateBoxes) {
                ctx.strokeRect(box.left, box.top, box.right - box.left, box.bottom - box.top);
            }
            ctx.restore();
        }

        function drawMeasurement(point) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = point.positive ? "#111" : "#fff";
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = "#111";
            ctx.stroke();
            ctx.restore();
        }

        function drawPath() {
            if (path.length < 2) return;
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let index = 1; index < path.length; index++) {
                ctx.lineTo(path[index].x, path[index].y);
            }
            ctx.strokeStyle = "#1468d4";
            ctx.lineWidth = 5;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.stroke();
            ctx.restore();
        }

        function drawSensor() {
            const halfSize = SENSOR_SIZE / 2;
            ctx.save();
            ctx.strokeStyle = "#111";
            ctx.lineWidth = 3;
            ctx.strokeRect(sensorPosition.x - halfSize, sensorPosition.y - halfSize, SENSOR_SIZE, SENSOR_SIZE);
            ctx.beginPath();
            ctx.arc(sensorPosition.x, sensorPosition.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = "#111";
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            ctx.save();
            ctx.clearRect(0, 0, ENV_SIZE, ENV_SIZE);
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, ENV_SIZE, ENV_SIZE);

            if (showTruth) {
                ctx.fillStyle = "rgba(128, 128, 128, 0.45)";
                ctx.fillRect(
                    groundTruth.left,
                    groundTruth.top,
                    groundTruth.right - groundTruth.left,
                    groundTruth.bottom - groundTruth.top
                );
            }

            drawCandidateBoxes();
            drawPath();
            priorMeasurements.forEach(drawMeasurement);
            futureMeasurements.forEach(drawMeasurement);
            drawSensor();
            ctx.restore();
        }

        function animate(timestamp) {
            if (timestamp - lastCandidateRefresh >= CANDIDATE_REFRESH_INTERVAL) {
                refreshCandidateBoxes();
                lastCandidateRefresh = timestamp;
            }

            if (mode === "running") {
                const dt = previousAnimationTime === null
                    ? 0
                    : Math.min((timestamp - previousAnimationTime) / 1000, 0.1);
                runDistance = Math.min(pathLength, runDistance + SENSOR_SPEED * dt);
                sensorPosition = pointAtPathDistance(runDistance);

                if (timestamp - lastSensorSample >= SENSOR_SAMPLE_INTERVAL) {
                    sampleSensor();
                    lastSensorSample = timestamp;
                }

                if (runDistance >= pathLength) {
                    mode = "complete";
                    runButton.textContent = "Trajectory Complete";
                    hint.innerHTML = "<strong>Trajectory complete.</strong> Select <strong>Reset</strong> to try a new problem.";
                }
            }

            previousAnimationTime = timestamp;
            draw();
            requestAnimationFrame(animate);
        }

        stage.addEventListener("pointerdown", beginDrawing);
        stage.addEventListener("pointermove", continueDrawing);
        stage.addEventListener("pointerup", finishDrawing);
        stage.addEventListener("pointercancel", finishDrawing);
        resetButton.addEventListener("click", () => resetProblem());
        runButton.addEventListener("click", startTrajectory);
        truthButton.addEventListener("click", () => {
            showTruth = !showTruth;
            truthButton.textContent = showTruth ? "Hide Ground Truth" : "Show Ground Truth";
            draw();
        });
        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();
        resetProblem(INITIAL_SEED);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
